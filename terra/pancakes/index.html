<!DOCTYPE html>
<html>

	<body>
	</body>
	<script type="importmap">
	{
	  "imports": {
		"three": "https://cdn.jsdelivr.net/npm/three@v0.186.1/build/three.module.js",
	    "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.186.1/examples/jsm/"
	  }
	}
	</script>

	<button id="loadbutton">generate new (will be less detailed because generation is slower on web)(will hang site while generating, check progress in console)</button>
	<button id="downloadbutton">download obj</button>
	<script type="module">
		/*Module.print(text) {
			console.log("text" + text + "\n");
		}*/
/*		Module.print = function(text) {
				console.log("text" + text + "\n");
			}*/
		import * as THREE from 'three';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

		const scene = new THREE.Scene();
		const camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 1000 );
		const loader = new OBJLoader();
		const renderer = new THREE.WebGLRenderer();
		const controls = new OrbitControls( camera, renderer.domElement );


		renderer.setSize( window.innerWidth * 0.95, window.innerHeight * 0.95);
		document.body.appendChild( renderer.domElement );

		const light = new THREE.AmbientLight( 0x404040 ); // soft white light
		scene.add( light );
		const directionalLight = new THREE.DirectionalLight( 0xffffff, 1 );
		directionalLight.position.set(-10, 30, 50);
		scene.add( directionalLight );

		const material = new THREE.MeshStandardMaterial( {color: 0xffb85c } );

		let rocks = await loader.loadAsync( 'rocks.obj' );
		rocks.children[0].material = material;
		console.log(rocks);

		scene.add( rocks );
		
		camera.position.set( 0, 20, 50 );
		controls.update();

		document.getElementById("downloadbutton").onclick = function() {
			if(Module.FS.analyzePath("layer.obj").exists) {
				download(Module.FS.readFile("layer.obj", {encoding: 'utf8'}), "rocks.obj", 'utf8');
			} else {
        var a = document.createElement('a');
        a.href = "rocks.obj";
        a.download = "rocks.obj";
        a.click();
			}
		}
		// Source - https://stackoverflow.com/a/19230668␍
// Posted by Yassir Ennazk␍
// Retrieved 2026-10-31, License - CC BY-SA 3.0␍
function download(content, filename, contentType)
{
    if(!contentType) contentType = 'application/octet-stream';
        var a = document.createElement('a');
        var blob = new Blob([content], {'type':contentType});
        a.href = window.URL.createObjectURL(blob);
        a.download = filename;
        a.click();
}


			let newrocks;
		document.getElementById("loadbutton").onclick = async() => {
			scene.remove(rocks);
			scene.remove(newrocks);
			Module.callMain();
			console.log(Module.FS.readFile("layer.obj", {encoding: 'utf8'}));
			newrocks = loader.parse(Module.FS.readFile("layer.obj", {encoding: 'utf8'}));
			newrocks.children[0].material = material;

			scene.add( newrocks );
		}

		function animate( time ) {
			controls.update();
  			renderer.render( scene, camera );
		}
		renderer.setAnimationLoop( animate );
	</script>
	<script src="rock_gen.js"></script>
</html>
